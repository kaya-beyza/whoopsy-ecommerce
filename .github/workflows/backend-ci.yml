name: Backend CI

  on:
    push:
      branches: [ main ]
      paths:
        - 'backend/**'          # Sadece backend dosyaları değişince çalış
    pull_request:
      branches: [ main ]
      paths:
        - 'backend/**'

  # İş tanımları — her job bir "kontrol adımı"
  jobs:
    build-and-test:
      # Hangi makinede çalışacak? GitHub'ın ücretsiz Ubuntu sunucusu
      runs-on: ubuntu-latest

      # Adımlar — sırayla çalışır
      steps:
        # 1. Kodu çek — repo dosyalarını sunucuya indir
        # Analoji: Fabrikaya hammadde getirmek
        - name: Checkout code
          uses: actions/checkout@v4

        # 2. .NET SDK'yı kur
        # Analoji: Fabrikadaki makineleri kurmak
        - name: Setup .NET
          uses: actions/setup-dotnet@v4
          with:
            dotnet-version: '10.0.x'

        # 3. NuGet paketlerini indir (bağımlılıklar)
        # Analoji: Yedek parçaları getirmek
        - name: Restore dependencies
          run: dotnet restore
          working-directory: backend

        # 4. Projeyi build et — derleme hatası var mı?
        # --no-restore → zaten 3. adımda restore ettik, tekrar yapma
        # Analoji: Ürünü üretmek
        - name: Build
          run: dotnet build --no-restore --configuration Release
          working-directory: backend

        # 5. Testleri çalıştır — birim testler geçiyor mu?
        # --no-build → zaten 4. adımda build ettik
        # Analoji: Kalite kontrol — ürünü test etmek
        - name: Test
          run: dotnet test --no-build --configuration Release --verbosity normal
          working-directory: backend
