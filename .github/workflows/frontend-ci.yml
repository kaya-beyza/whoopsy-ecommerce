 # Frontend için CI — Angular projesinin build kontrolü
  name: Frontend CI

  on:
    push:
      branches: [ main ]
      paths:
        - 'frontend/**'  # Sadece frontend dosyaları değişince çalış
    pull_request:
      branches: [ main ]
      paths:
        - 'frontend/**'

  jobs:
    build:
      runs-on: ubuntu-latest

      steps:
        # 1. Kodu çek
        - name: Checkout code
          uses: actions/checkout@v4

        # 2. Node.js kur — Angular, Node.js üzerinde çalışır
        # Backend'de .NET kuruyorduk, frontend'de Node.js kuruyoruz
        - name: Setup Node.js
          uses: actions/setup-node@v4
          with:
            node-version: '22'
            cache: 'npm'    # node_modules'ü cache'le (hız için)
            cache-dependency-path: 'frontend/package-lock.json'

        # 3. npm paketlerini indir
        # Backend'deki "dotnet restore" karşılığı
        - name: Install dependencies
          run: npm ci
          working-directory: frontend

        # 4. Angular projesini build et
        # --configuration=production → üretim modu (daha sıkı kontrol)
        # Backend'deki "dotnet build" karşılığı
        - name: Build
          run: npx ng build --configuration=production
          working-directory: frontend
