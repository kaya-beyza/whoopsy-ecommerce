@if (subCategories.length > 0) {
<div class="mega-menu-elite">
  <div class="mega-container">
    <div class="mega-content-wrapper">
      
      <!-- ── LINKS COLUMN ────────────────────────── -->
      <div class="mega-links-column">
        <div class="column-header">
          <span class="column-tag">KOLEKSİYON</span>
          <h4 class="column-title">Kategoriler</h4>
        </div>
        
        <div class="links-grid">
          @for (cat of subCategories; track cat.id) {
          <a class="mega-link" [routerLink]="['/urunler/kategori', cat.id]">
            <span class="link-label">{{ cat.label }}</span>
            <span class="link-count">Yeni</span>
          </a>
          }
        </div>
      </div>

      <!-- ── FEATURED SECTION ────────────────────── -->
      <div class="mega-featured-section">
        <div class="featured-card">
          <div class="card-overlay"></div>
          <div class="card-content">
            <span class="feat-tag">ÖNE ÇIKAN</span>
            <h5 class="feat-title">Sizin İçin Seçtiklerimiz</h5>
            <p class="feat-desc">Yeni sezon koleksiyonumuzun en seçkin parçalarını hemen keşfedin.</p>
            <a [routerLink]="['/urunler/kategori', categoryId]" class="feat-link">TÜMÜNÜ GÖR →</a>
          </div>
        </div>
      </div>

    </div>
  </div>
</div>
}
