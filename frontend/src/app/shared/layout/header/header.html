<header class="site-header">

  <div class="top-bar">
    <div class="top-bar__left"></div>

    <span class="top-bar__text">
      Ücretsiz Kargo · 3.000₺ ve Üzeri Siparişlerde!
    </span>

    <div class="top-bar__right">
      <a routerLink="/login" class="top-bar__link">Giriş Yap</a>
      <span class="top-bar__divider">|</span>
      <a routerLink="/register" class="top-bar__link">Kaydol</a>

      <span class="material-symbols-sharp top-bar__icon">person</span>
    </div>
  </div>

  <div class="main-bar">

    <a class="logo" routerLink="/">
      <span class="logo-w">w</span>
      <span class="logo-h">h</span>
      <span class="logo-oopsy">
        <span class="eye-o">O</span>
        <span class="eye-o">O</span>
        <span class="logo-ps">PS</span>
      </span>
      <span class="logo-y">y</span>
    </a>

    <div class="navbar-wrapper">
      <app-navbar />
    </div>

    <div class="header-icons">
      <button class="icon-btn" aria-label="Ara" (click)="toggleSearch()">
        <span class="material-symbols-sharp">search</span>
      </button>

      <a class="icon-btn" routerLink="/favorites" aria-label="Favoriler">
        <span class="material-symbols-sharp">favorite</span>
      </a>

      <a class="icon-btn cart-icon" routerLink="/cart" aria-label="Sepetim">
        @if (cartCount() > 0) {
        <span class="cart-badge">{{ cartCount() }}</span>
        }
        <span class="material-symbols-sharp">local_mall</span>
      </a>
    </div>

  </div>

  <!-- Whomopsy Elite Search Overlay: Ekranı asaletle kaplayan arama katmanı 🏛️ -->
  @if (isSearchOpen()) {
  <div class="search-overlay" (click)="$event.stopPropagation()">
    <div class="search-overlay__container">
      <div class="search-overlay__header">
        <button class="close-search" (click)="toggleSearch()">
          <span class="material-symbols-sharp">close</span>
        </button>
      </div>
      <div class="search-overlay__content">
        <div class="search-field">
          <span class="material-symbols-sharp search-field-icon">search</span>
          <input 
            type="text" 
            [(ngModel)]="searchQuery" 
            (keyup.enter)="onSearchSubmit()"
            placeholder="Kategori, Ürün veya Marka Ara." 
            class="search-input"
            autofocus
          >
        </div>
        <div class="search-tips">
          <span class="tip-label">Popüler:</span>
          <span class="tip-tag">adidas</span>
          <span class="tip-tag">Puma Speedcat</span>
          <span class="tip-tag">New Balance 9060</span>
        </div>
      </div>
    </div>
    <div class="search-overlay__backdrop" (click)="toggleSearch()"></div>
  </div>
  }

</header>
