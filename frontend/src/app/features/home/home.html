<div class="home-wrapper">

  <section class="slider-container">

    <div class="slide-item" [class.active]="currentSlide === 0">
      <video *ngIf="currentSlide === 0" autoplay loop muted playsinline class="video-slide">
        <source src="/assets/images/video-1.mp4" type="video/mp4">
      </video>
      <div class="slide-info">
        <h1 class="hero-title">Keşfet</h1>
        <p class="hero-subtitle">Spor modasında iz bırakmış markaların sneaker, giyim ve aksesuar seçenekleri.</p>
        <button class="hero-btn">KOLEKSİYONU GÖR</button>
      </div>
    </div>

    <div class="slide-item" [class.active]="currentSlide === 1">
      <img src="/assets/images/ana-banner-2.jpg" alt="Bahar Fırsatları">
      <div class="slide-info">
        <h1 class="hero-title">Bahar Esintisi</h1>
        <p class="hero-subtitle">Seçili ürünlerde %40'a varan indirimler.</p>
        <button class="hero-btn">İNDİRİMİ YAKALA</button>
      </div>
    </div>

    <div class="slide-item" [class.active]="currentSlide === 2">
      <video *ngIf="currentSlide === 2" autoplay loop muted playsinline class="video-slide">
        <source src="/assets/images/video-3.mp4" type="video/mp4">
      </video>
      <div class="slide-info">
        <h1 class="hero-title">Limited Edition</h1>
        <p class="hero-subtitle">Sadece sana özel, sınırlı sayıda üretim.</p>
        <button class="hero-btn">SERİYİ İNCELE</button>
      </div>
    </div>

    <button class="nav-arrow prev" (click)="prevSlide()">
      <i class="fas fa-chevron-left"></i>
    </button>
    <button class="nav-arrow next" (click)="nextSlide()">
      <i class="fas fa-chevron-right"></i>
    </button>

    <div class="slider-dots">
      <span class="dot" [class.active]="currentSlide === 0" (click)="setSlide(0)"></span>
      <span class="dot" [class.active]="currentSlide === 1" (click)="setSlide(1)"></span>
      <span class="dot" [class.active]="currentSlide === 2" (click)="setSlide(2)"></span>
    </div>

  </section>

  <section class="categories-section">
    <h2 class="section-title">Kategorileri Keşfet</h2>

    <div class="category-grid">
      <div class="category-card">
        <img src="/assets/images/kadin.jpg" alt="Kadın Modası">
        <div class="card-label">
          <span>Kadın</span>
          <i class="fas fa-arrow-right"></i>
        </div>
      </div>

      <div class="category-card">
        <img src="/assets/images/erkek.jpg" alt="Erkek Modası">
        <div class="card-label">
          <span>Erkek</span>
          <i class="fas fa-arrow-right"></i>
        </div>
      </div>

      <div class="category-card">
        <img src="/assets/images/cocuk.jpg" alt="Çocuk Modası">
        <div class="card-label">
          <span>Çocuk</span>
          <i class="fas fa-arrow-right"></i>
        </div>
      </div>
    </div>
  </section>

</div>
