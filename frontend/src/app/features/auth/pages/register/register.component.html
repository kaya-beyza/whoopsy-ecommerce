<div class="login-viewport">
    <!-- Left Panel: Premium Lifestyle Asset (Consistent Brand Branding) -->
    <div class="brand-panel">
        <div class="asset-overlay"></div>
        <img src="https://res.cloudinary.com/dkwthtwgg/image/upload/q_auto/f_auto/v1777374553/log-in_lprtkj.jpg" alt="Whoopsy Brand Image" class="brand-asset">
        <div class="brand-tagline">
            <a class="logo-light" routerLink="/">
                <span class="logo-w">w</span>
                <span class="logo-h">h</span>
                <span class="logo-oopsy">
                    <span class="eye-o">O</span>
                    <span class="eye-o">O</span>
                    <span class="logo-ps">PS</span>
                </span>
                <span class="logo-y">y</span>
            </a>
            <p>Urban. Authentic. Premium.</p>
        </div>
    </div>

    <!-- Right Panel: Expansive Form Panel -->
    <div class="form-panel">
        <div class="login-container">
            <header class="form-header">
                <!-- Main Animated Logo -->
                <a class="logo-main" routerLink="/">
                    <span class="logo-w">w</span>
                    <span class="logo-h">h</span>
                    <span class="logo-oopsy">
                        <span class="eye-o">O</span>
                        <span class="eye-o">O</span>
                        <span class="logo-ps">PS</span>
                    </span>
                    <span class="logo-y">y</span>
                </a>

                <div class="header-titles">
                    <h1 class="welcome-title">Hesap Oluştur</h1>
                    <p class="subtitle">Yeni sezonun en özel parçalarına ilk siz ulaşın.</p>
                </div>
            </header>

            <form (ngSubmit)="onRegister()" class="login-form">
                <!-- Row 1: Name & Surname -->
                <div class="form-row">
                    <div class="form-group">
                        <label for="firstName">İSİM*</label>
                        <div class="input-wrapper">
                            <span class="material-symbols-sharp input-icon">person</span>
                            <input id="firstName" type="text" [(ngModel)]="firstName" name="firstName" required
                                placeholder="Adınız" />
                        </div>
                    </div>
                    <div class="form-group">
                        <label for="lastName">SOYİSİM*</label>
                        <div class="input-wrapper">
                            <span class="material-symbols-sharp input-icon">person</span>
                            <input id="lastName" type="text" [(ngModel)]="lastName" name="lastName" required
                                placeholder="Soyadınız" />
                        </div>
                    </div>
                </div>

                <!-- Row 2: Email -->
                <div class="form-group">
                    <label for="email">E-POSTA*</label>
                    <div class="input-wrapper">
                        <span class="material-symbols-sharp input-icon">mail</span>
                        <input id="email" type="email" [(ngModel)]="email" name="email" required autocomplete="email"
                            placeholder="E-posta adresiniz" />
                    </div>
                </div>

                <!-- Row 3: Phone -->
                <div class="form-group">
                    <label for="phone">TELEFON*</label>
                    <div class="input-wrapper">
                        <span class="material-symbols-sharp input-icon">call</span>
                        <input id="phone" type="tel" [(ngModel)]="phone" name="phone" required
                            placeholder="05xx xxx xx xx" />
                    </div>
                </div>

                <!-- Row 4: Password -->
                <div class="form-row">
                    <div class="form-group">
                        <label for="password">ŞİFRE*</label>
                        <div class="input-wrapper">
                            <span class="material-symbols-sharp input-icon">lock</span>
                            <input id="password" type="password" [(ngModel)]="password" name="password" required
                                placeholder="••••••••" />
                        </div>
                        <p class="input-hint">En az 6 karakter</p>
                    </div>
                    <div class="form-group">
                        <label for="confirmPassword">ŞİFRE TEKRAR*</label>
                        <div class="input-wrapper">
                            <span class="material-symbols-sharp input-icon">lock</span>
                            <input id="confirmPassword" type="password" [(ngModel)]="confirmPassword"
                                name="confirmPassword" required placeholder="••••••••" />
                        </div>
                    </div>
                </div>

                <!-- Row 5: Gender Selection -->
                <div class="form-group">
                    <label>CİNSİYET</label>
                    <div class="gender-selection">
                        <label class="radio-label">
                            <input type="radio" name="gender" [(ngModel)]="gender" value="Erkek">
                            <span class="radio-custom"></span>
                            Erkek
                        </label>
                        <label class="radio-label">
                            <input type="radio" name="gender" [(ngModel)]="gender" value="Kadın">
                            <span class="radio-custom"></span>
                            Kadın
                        </label>
                        <label class="radio-label">
                            <input type="radio" name="gender" [(ngModel)]="gender" value="Belirtmek istemiyorum">
                            <span class="radio-custom"></span>
                            Belirtmek istemiyorum
                        </label>
                    </div>
                </div>

                <!-- Row 6: Date of Birth -->
                <div class="form-group">
                    <label for="birthDate">DOĞUM TARİHİ*</label>
                    <div class="input-wrapper">
                        <span class="material-symbols-sharp input-icon">calendar_month</span>
                        <input id="birthDate" type="date" [(ngModel)]="birthDate" name="birthDate" required />
                    </div>
                </div>

                <!-- Row 7: Address (Requested) -->
                <div class="form-group">
                    <label for="address">ADRES</label>
                    <div class="input-wrapper">
                        <span class="material-symbols-sharp input-icon">location_on</span>
                        <textarea id="address" [(ngModel)]="address" name="address" rows="3"
                            placeholder="Teslimat adresi detayları..."></textarea>
                    </div>
                </div>

                <div class="error-msg" *ngIf="errorMessage">
                    <span class="material-symbols-sharp">error</span>
                    {{ errorMessage }}
                </div>

                <button type="submit" [disabled]="isLoading" class="primary-btn">
                    <span *ngIf="!isLoading">HESAP OLUŞTUR</span>
                    <span *ngIf="isLoading" class="loading-spinner">Kayıt tamamlanıyor...</span>
                </button>

                <div class="social-divider">
                    <span>veya</span>
                </div>

                <div class="social-login">
                    <button type="button" class="google-btn" (click)="onSocialLogin('Google')">
                        <img src="https://www.gstatic.com/images/branding/product/1x/gsa_512dp.png" alt="Google Logo">
                        Google ile Devam Et
                    </button>
                    <button type="button" class="apple-btn" (click)="onSocialLogin('Apple')">
                        <span class="material-icons">apple</span>
                        Apple ile Devam Et
                    </button>
                </div>
            </form>

            <footer class="form-footer">
                <span>Zaten hesabınız var mı?</span>
                <a routerLink="/login" class="signup-link">GİRİŞ YAP</a>
            </footer>
        </div>
    </div>
</div>
