<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#141414"/>
      <stop offset="100%" stop-color="#050505"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="2" stdDeviation="2" flood-color="#e8000d" flood-opacity="0.3"/>
    </filter>
  </defs>

  <!-- Background squircle -->
  <rect width="64" height="64" rx="16" fill="url(#bgGrad)"/>
  <rect width="62" height="62" x="1" y="1" rx="15" fill="none" stroke="#262626" stroke-width="1"/>

  <!-- Left 'O' Eye -->
  <g filter="url(#glow)">
    <!-- Outer red 'O' shape -->
    <rect x="11" y="14" width="18" height="36" rx="9" fill="#e8000d"/>
    <!-- Inner eye socket (white eyeball) -->
    <rect x="15" y="20" width="10" height="24" rx="5" fill="#ffffff"/>
    <!-- Black pupil looking top-left (the signature whoopsy glance) -->
    <circle cx="19" cy="29" r="3.5" fill="#050505"/>
    <!-- Glint / catchlight -->
    <circle cx="17.8" cy="27.8" r="1.1" fill="#ffffff"/>
  </g>

  <!-- Right 'O' Eye -->
  <g filter="url(#glow)">
    <!-- Outer red 'O' shape -->
    <rect x="35" y="14" width="18" height="36" rx="9" fill="#e8000d"/>
    <!-- Inner eye socket (white eyeball) -->
    <rect x="39" y="20" width="10" height="24" rx="5" fill="#ffffff"/>
    <!-- Black pupil looking top-left in sync -->
    <circle cx="43" cy="29" r="3.5" fill="#050505"/>
    <!-- Glint / catchlight -->
    <circle cx="41.8" cy="27.8" r="1.1" fill="#ffffff"/>
  </g>
</svg>
